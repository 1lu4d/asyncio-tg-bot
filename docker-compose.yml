services:
  bot:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data # persists the SQLite file outside the container
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sqlite3; sqlite3.connect('/app/data/dictionary.db').close()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
